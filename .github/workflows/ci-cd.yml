# CI/CD de contract-api (ADR-0009, ADR-0011, ADR-0012, ADR-0016).
# - Pull Request a master: build, pruebas (Testcontainers), cobertura, análisis SonarCloud (si hay SONAR_TOKEN)
#   y build de la imagen sin publicarla. Sus dos checks son obligatorios para integrar (ruleset master-protegida).
# - Push a master (merge del PR): lo anterior y publicación de la imagen en GHCR (latest + sha) y, si está
#   configurado, en Docker Hub (variable DOCKERHUB_USERNAME y secreto DOCKERHUB_TOKEN). Después se verifica la
#   imagen en un entorno efímero. El despliegue es con Docker, desde el Jenkins local (ADR-0014, ADR-0016).
# - Tag vX.Y.Z: publicación con las etiquetas de versión.
name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Nombre de la imagen en Docker Hub (en GHCR se usa el nombre del repositorio).
  IMAGE_NAME: ai-cicd

jobs:
  build:
    name: Build, pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Historial completo: SonarCloud lo usa para distinguir el código nuevo y asignar autores.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Incluye pruebas de integración con Testcontainers (Docker disponible en ubuntu-latest)
      # y el umbral de cobertura de JaCoCo en domain y application.
      - name: Compilar y verificar
        run: ./mvnw -B -ntp clean verify

      # El análisis solo se ejecuta si el repositorio tiene el secreto SONAR_TOKEN (en un fork se omite).
      - name: ¿SonarCloud configurado?
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      # Reutiliza las clases compiladas y los informes jacoco.xml del paso anterior. Con qualitygate.wait
      # el job falla si no se cumple el Quality Gate (p. ej. issues críticos en el código nuevo).
      - name: Análisis SonarCloud
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || github.repository_owner }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
          -Dsonar.qualitygate.wait=true

      - name: Resumen de cobertura
        if: always()
        run: |
          {
            echo "### Cobertura (JaCoCo)"
            echo "| Módulo | Líneas | Ramas | Umbral |"
            echo "|---|---|---|---|"
            for module in domain application infrastructure; do
              csv="$module/target/site/jacoco/jacoco.csv"
              [ -f "$csv" ] || continue
              threshold="80 % líneas"; [ "$module" = infrastructure ] && threshold="—"
              awk -F, -v m="$module" -v t="$threshold" 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
                END { printf "| %s | %.1f %% | %.1f %% | %s |\n", m, 100 * lc / (lm + lc), (bm + bc) ? 100 * bc / (bm + bc) : 0, t }' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

  image:
    name: Imagen Docker
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Opcional: sin la variable DOCKERHUB_USERNAME (p. ej. en un fork) solo se publica en GHCR.
      - name: Login en Docker Hub
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # El nombre de la imagen se normaliza a minúsculas (ghcr.io/christophersanz/ai-cicd).
      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build y publicación
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Verificación automática de la imagen publicada (ADR-0012): la levanta por su sha (no "latest") en un
  # entorno efímero del runner con PostgreSQL y claves JWT temporales, y pasa la prueba de humo. Así cada
  # imagen publicada de master se sabe que arranca y responde (el despliegue es con Docker, ADR-0016).
  verify:
    name: Verificación de la imagen
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: contracts
          POSTGRES_USER: contract
          POSTGRES_PASSWORD: contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contract -d contracts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Claves JWT y contraseña del administrador generadas en el momento: no hay secretos que guardar y no
      # sobreviven al job. Los PEM van en una sola línea con \n literales, como espera el perfil prod.
      - name: Configuración efímera
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem 2>/dev/null
          openssl pkey -in private.pem -pubout -out public.pem
          admin_password="Deploy-$(openssl rand -hex 12)"
          echo "::add-mask::$admin_password"
          echo "ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          {
            echo "DB_URL=jdbc:postgresql://localhost:5432/contracts"
            echo "DB_USERNAME=contract"
            echo "DB_PASSWORD=contract"
            echo "SECURITY_JWT_PUBLIC_KEY=$(awk '{printf "%s\\n", $0}' public.pem)"
            echo "SECURITY_JWT_PRIVATE_KEY=$(awk '{printf "%s\\n", $0}' private.pem)"
            echo "SECURITY_BOOTSTRAP_ADMIN_USERNAME=admin"
            echo "SECURITY_BOOTSTRAP_ADMIN_PASSWORD=$admin_password"
          } > prod.env
          rm private.pem public.pem

      - name: Levantar la imagen publicada
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker run -d --name contract-api --network host --env-file prod.env "$image"

      - name: Prueba de humo
        run: .github/scripts/smoke-test.sh http://localhost:8081 "Imagen verificada (entorno efímero)"

      - name: Logs del contenedor
        if: always()
        run: docker logs contract-api 2>&1 | tail -n 200 || true

      - name: Retirar el entorno efímero
        if: always()
        run: |
          docker rm -f contract-api || true
          rm -f prod.env
