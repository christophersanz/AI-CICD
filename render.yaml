# Blueprint de Render para contract-api (ADR-0013). Se importa una sola vez desde el panel de Render
# (New → Blueprint, eligiendo este repositorio). Crea el servicio web y la base PostgreSQL.
# Guía paso a paso: docs/guides/ci-cd.md §5.4.
#
# El servicio NO se redespliega solo: lo despliega el job "Despliegue (production)" del pipeline, tras la
# aprobación del environment production, con la imagen de Docker Hub por su sha (autoDeploy: false).
# Los valores con "sync: false" los pide Render al importar y nunca se versionan.
services:
  - type: web
    name: contract-api
    runtime: image
    image:
      url: docker.io/christopherdocker/ai-cicd:latest
    plan: free
    region: virginia
    healthCheckPath: /actuator/health
    autoDeploy: false
    envVars:
      # La API escucha en 8081 (application.yml); Render enruta el tráfico al puerto indicado en PORT.
      - key: PORT
        value: "8081"
      # JDBC: jdbc:postgresql://<Hostname interno de contract-db>:5432/contracts (Render da la URL como
      # postgresql://..., que el driver JDBC no acepta, por eso se define a mano).
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        fromDatabase:
          name: contract-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: contract-db
          property: password
      # PEM en una sola línea con \n literales (docs/guides/ci-cd.md §8.2). Claves propias de production.
      - key: SECURITY_JWT_PUBLIC_KEY
        sync: false
      - key: SECURITY_JWT_PRIVATE_KEY
        sync: false
      - key: SECURITY_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      # La misma contraseña va en el secreto SMOKE_ADMIN_PASSWORD del environment production de GitHub.
      - key: SECURITY_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # El plan gratuito tiene 512 MB: se limita la memoria de la JVM y se acelera el arranque.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

databases:
  - name: contract-db
    databaseName: contracts
    user: contract
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: []
